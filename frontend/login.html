<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    
    body{
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    .login-form {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 300px;
    }
    .login-form h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    .login-form label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .login-form input {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .login-form button {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    .login-form button:hover {
        background-color: #218838;
    }
</style>
</head>
<body>
<div class="login-form">
    <h2>הרשמה</h2>
    <form action="#" method="post">

        <label for="email">איימיל:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">סיססמה:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" onclick="">כניסה</button>    

</body>
</html>
